name: Release

# Publishes the version in pyproject.toml to PyPI, then tags it (vX.Y.Z)
# and creates a GitHub release with the built files.
#
# Run it from the Actions tab ("Run workflow") on master.
#
# PyPI authentication, either:
#   * a repository secret PYPI_API_TOKEN (a PyPI API token), or
#   * PyPI trusted publishing: on pypi.org, project dj-url-filter,
#     Publishing -> add a GitHub publisher with owner "enjoy2000",
#     repository "dj-url-filter", workflow "release.yml", no environment.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Read version
      id: version
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['poetry']['version'])")
        init_version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('url_filter/__init__.py').read()).group(1))")
        if [ "$version" != "$init_version" ]; then
          echo "::error::pyproject.toml version $version does not match url_filter/__init__.py $init_version"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Check version is not already released
      run: |
        version='${{ steps.version.outputs.version }}'
        status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/dj-url-filter/$version/json")
        if [ "$status" = "200" ]; then
          echo "::error::dj-url-filter $version is already on PyPI; bump the version first"
          exit 1
        fi
        if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
          echo "::error::tag v$version already exists"
          exit 1
        fi
    - name: Build
      run: |
        python -m pip install --upgrade build twine
        python -m build
        python -m twine check --strict dist/*
        ls -l dist
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # Empty when the secret is not set, which makes the action use
        # trusted publishing instead.
        password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Tag and create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        gh release create "v$VERSION" dist/* \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "v$VERSION" \
          --generate-notes
