[tox]
envlist =
    py312-django42-drf317
    py{312,313,314}-django{52,60,latest}-drflatest

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
allowlist_externals = make
passenv = *
setenv =
    PYTHONPATH = {toxinidir}
commands =
    make install INSTALL_LOG=/dev/null
    make clean-build clean-pyc clean-test test
deps =
    # coreapi (legacy DRF schema integration) imports pkg_resources
    setuptools<81
    SQLAlchemy<1.5
    django42: django>=4.2,<5.0
    django52: django>=5.2,<5.3
    django60: django>=6.0,<6.1
    djangolatest: django
    drf317: djangorestframework>=3.17,<3.18
    drflatest: djangorestframework

[flake8]
ignore = E501,W503
