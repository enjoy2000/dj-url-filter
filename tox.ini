[tox]
envlist =
    py{313,314}-django{52,60,latest}-drflatest
    # Django 6.1 is the first release supporting Python 3.15
    py315-djangolatest-drflatest

[gh-actions]
python =
    3.13: py313
    3.14: py314
    3.15: py315

[testenv]
allowlist_externals = make
passenv = *
setenv =
    PYTHONPATH = {toxinidir}
commands =
    make install INSTALL_LOG=/dev/null
    make clean-build clean-pyc clean-test test
deps =
    SQLAlchemy<1.5
    django52: django>=5.2,<5.3
    django60: django>=6.0,<6.1
    djangolatest: django
    drflatest: djangorestframework

[flake8]
ignore = E501,W503
